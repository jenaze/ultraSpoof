mode: client
psk: PUT_YOUR_SECURE_PSK_HERE
log_level: info
client:
  listen:
    socks: 127.0.0.1:1080
  upstream_socks: direct
  remote: 127.0.0.1:51123
  fast_recovery: true
  control_dial_retries: 8
  control_dial_retry_interval_ms: 150
  download:
    listen_udp: 0.0.0.0:9444
    spoof_source_ip: 1.1.1.1
    receive_timeout: 180s

    encryption: none

    socket_recv_buffer_bytes: 134217728
    recv_workers: 0
    session_queue_size: 262144
    recv_sockets: 2
    recv_batch_size: 128

    nack_interval_ms: 20
    nack_max_tries: 30
    skip_timeout_ms: 1500
    nack_lookahead: 32768
    max_pending_packets: 524288
    nack_tick_ms: 5
    skip_check_ms: 20
    stats_interval_sec: 5
  protocol_version: 1
