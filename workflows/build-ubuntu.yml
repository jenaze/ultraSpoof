name: Build ultraSpoof Ubuntu Binary

on:
  # این گزینه به شما اجازه می‌دهد ورکفلو را به صورت دستی از تب Actions در گیت‌هاب اجرا کنید
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # ۱. واکشی کدهای پروژه
    - name: Checkout Code
      uses: actions/checkout@v4

    # ۲. راه‌اندازی محیط گو نسخه ۱.۲۲
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: true

    # ۳. بررسی و دانلود دپندرسی‌ها (تنظیم فایل go.sum و go.mod)
    - name: Install Dependencies
      run: go mod download

    # ۴. کامپایل باینری با استفاده از اسکریپت موجود در پروژه شما
    - name: Run Build Script
      run: |
        chmod +x scripts/build_linux_amd64.sh
        ./scripts/build_linux_amd64.sh

    # ۵. آپلود فایل نهایی برای دانلود راحت از محیط گیت‌هاب
    - name: Upload Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ultraSpoof-ubuntu-amd64
        path: ultraSpoof
        retention-days: 7
